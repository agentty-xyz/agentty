base_url = "https://agentty.xyz"
title = "Agentty"
description = "Agentty is an ADE (Agentic Development Environment) for structured, controllable AI-assisted software development."
default_language = "en"
compile_sass = true
minify_html = true
build_search_index = true
generate_feeds = false
ignored_content = ["**/AGENTS.md", "**/CLAUDE.md", "**/GEMINI.md"]

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "fuse_json"

[markdown]
render_emoji = true
external_links_target_blank = true
insert_anchor_links = "right"

[markdown.highlighting]
style = "inline"
theme = "gruvbox-dark-medium"

[extra]
github_repo = "https://github.com/agentty-xyz/agentty"
github_repo_slug = "agentty-xyz/agentty"
npm_package = "https://www.npmjs.com/package/agentty"
