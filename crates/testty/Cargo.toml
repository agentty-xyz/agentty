[package]
name = "testty"
autoexamples = false
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
keywords = ["tui", "testing", "e2e", "pty", "ratatui"]
categories = ["development-tools::testing", "command-line-interface"]
include = [
  "src/**/*",
  "examples/**/*",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
]

# `cargo binstall testty` installs the GitHub release archives; `ag-release`
# checks that these match the archive names.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lints]
workspace = true

[[example]]
name = "frame_diffing"
test = true

[[example]]
name = "journey_composition"
test = true

[[example]]
name = "proof_pipeline"
test = true

[dependencies]
base64.workspace = true
clap.workspace = true
image.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
unicode-width.workspace = true
vt100.workspace = true

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
