[package]
name = "agentty"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

# `cargo binstall agentty` installs the GitHub release archives; `ag-release`
# checks that these match the archive names.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "agentty"
path = "src/main.rs"

# PTY suites run only through `test-agentty-e2e`, which names them. Keeping
# them out of `--tests` stops other test and coverage runs from compiling them.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
test = false
bench = false

[[test]]
name = "protocol_compliance_e2e"
test = false
bench = false

# Live prompt evaluation: its own harness, so `main` can dispatch the
# native sandbox helper before anything else, as Agentty's `main` does.
[[test]]
name = "prompt_evaluation"
harness = false

# Marketing asset generators: a plain binary without the test harness that
# only the `e2e-container` hook runs, when `AGENTTY_MARKETING_ASSETS` names
# assets. Cargo still builds it with dev-dependencies and the `agentty` binary.
[[test]]
name = "showcase"
path = "tests/showcase/main.rs"
harness = false
test = false
bench = false

[lints]
workspace = true

[dependencies]
ag-telemetry = { workspace = true, features = ["otlp"] }
ag-clipboard.workspace = true
ag-forge.workspace = true
ag-git.workspace = true
ag-protocol.workspace = true
ag-remote.workspace = true
ag-contracts.workspace = true
ag-session.workspace = true
ag-store.workspace = true
ag-tui-text.workspace = true
ag-worker.workspace = true
async-trait.workspace = true
askama.workspace = true
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
hex.workspace = true
ignore.workspace = true
image.workspace = true
qrcode.workspace = true
ratatui.workspace = true
reqwest.workspace = true
rustls.workspace = true
pulldown-cmark.workspace = true
rustc-hash.workspace = true
rustix = { workspace = true, features = ["system"] }
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
tachyonfx.workspace = true
tempfile.workspace = true
time.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
unicode-width.workspace = true

[dev-dependencies]
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
ag-clipboard = { workspace = true, features = ["test-utils"] }
ag-contracts = { workspace = true, features = ["test-utils"] }
ag-session = { workspace = true, features = ["test-utils"] }
ag-worker = { workspace = true, features = ["test-utils"] }
ag-forge = { workspace = true, features = ["test-utils"] }
ag-git = { workspace = true, features = ["test-utils"] }
ag-store = { workspace = true, features = ["test-utils"] }
# The workspace unifies features (`.cargo/config.toml`), so this also builds
# the doubles that `ag-remote`'s own server tests start the server with.
ag-remote = { workspace = true, features = ["test-utils"] }
ag-relay.workspace = true
assert_cmd.workspace = true
futures-util.workspace = true
testty.workspace = true
mockall.workspace = true
opentelemetry-proto = { workspace = true, features = ["logs"] }
prost.workspace = true
wiremock.workspace = true
sqlx = { workspace = true, features = ["sqlx-toml"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true
