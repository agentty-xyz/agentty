[package]
name = "agentty"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[[bin]]
name = "agentty"
path = "src/main.rs"

# PTY suites run only through `test-agentty-e2e`, which names them. Keeping
# them out of `--tests` stops other test and coverage runs from compiling them.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
test = false
bench = false

[[test]]
name = "protocol_compliance_e2e"
test = false
bench = false

[[test]]
name = "showcase"
test = false
bench = false

[lints]
workspace = true

[dependencies]
ag-telemetry = { workspace = true, features = ["otlp"] }
ag-clipboard.workspace = true
ag-forge.workspace = true
ag-git.workspace = true
ag-protocol.workspace = true
ag-contracts.workspace = true
ag-session.workspace = true
ag-store.workspace = true
ag-tui-text.workspace = true
ag-worker.workspace = true
async-trait.workspace = true
askama.workspace = true
clap.workspace = true
crossterm.workspace = true
ignore.workspace = true
image.workspace = true
ratatui.workspace = true
reqwest.workspace = true
rustls.workspace = true
pulldown-cmark.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sqlx.workspace = true
sysinfo.workspace = true
tachyonfx.workspace = true
time.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
unicode-width.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc.workspace = true

[dev-dependencies]
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
ag-contracts = { workspace = true, features = ["test-utils"] }
ag-session = { workspace = true, features = ["test-utils"] }
ag-worker = { workspace = true, features = ["test-utils"] }
ag-forge = { workspace = true, features = ["test-utils"] }
ag-git = { workspace = true, features = ["test-utils"] }
ag-store = { workspace = true, features = ["test-utils"] }
assert_cmd.workspace = true
testty.workspace = true
mockall.workspace = true
opentelemetry-proto = { workspace = true, features = ["logs"] }
prost.workspace = true
wiremock.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
