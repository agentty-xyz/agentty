[package]
name = "ag-harness-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
# Keep this companion CLI out of crates.io releases.
publish = false

[[bin]]
name = "ag-harness"
path = "src/main.rs"

[dependencies]
ag-harness = { workspace = true, features = ["native-sandbox", "otel", "providers-compat", "providers-openai", "sqlite"] }
ag-telemetry = { workspace = true, features = ["otlp"] }
async-trait.workspace = true
clap.workspace = true
futures-core.workspace = true
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "net"] }
uuid.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
jsonschema.workspace = true
opentelemetry-proto.workspace = true
prost.workspace = true
tempfile.workspace = true
testty.workspace = true
url.workspace = true
wiremock.workspace = true

[lints]
workspace = true
