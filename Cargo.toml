[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.18.3"
authors = [
  "Vladimir Minev <minev.dev@gmail.com>",
  "Andrei Agaev <andagaev@gmail.com>",
]
edition = "2024"
license = "Apache-2.0"
description = "Agentty is an ADE (Agentic Development Environment) for structured, controllable AI-assisted software development."
repository = "https://github.com/agentty-xyz/agentty"

[workspace.dependencies]
# Until the SQLx security pin below has a registry release, omit registry versions
# along its dependent chain so those crates cannot publish against vulnerable
# workspace crates already on crates.io.
ag-agent = { path = "crates/ag-agent" }
ag-contracts = { path = "crates/ag-contracts", version = "0.18.3" }
ag-clipboard = { path = "crates/ag-clipboard", version = "0.18.3" }
ag-forge = { path = "crates/ag-forge", version = "0.18.3" }
ag-git = { path = "crates/ag-git", version = "0.18.3" }
ag-harness = { path = "crates/ag-harness" }
ag-protocol = { path = "crates/ag-protocol", version = "0.18.3" }
ag-runtime = { path = "crates/ag-runtime" }
ag-router = { path = "crates/ag-router", version = "0.18.3" }
ag-scheduler = { path = "crates/ag-scheduler", version = "0.18.3" }
ag-session = { path = "crates/ag-session", version = "0.18.3" }
ag-store = { path = "crates/ag-store", version = "0.18.3" }
ag-telemetry = { path = "crates/ag-telemetry", version = "0.18.3", default-features = false }
ag-tui-text = { path = "crates/ag-tui-text", version = "0.18.3" }
ag-worker = { path = "crates/ag-worker", version = "0.18.3" }
testty = { path = "crates/testty", version = "0.18.3" }
async-trait = "0.1"
anyhow = "1"
assert_cmd = "2"
askama = "0.16.1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
close_fds = "0.3.2"
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
hex = "0.4.3"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
jsonschema = { version = "0.60.0", default-features = false }
libc = "0.2"
libproc = "0.15.0"
mockall = "0.15"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["internal-logs", "metrics", "trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["internal-logs", "metrics", "trace"] }
percent-encoding = "2"
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
portable-pty = "0.9"
prost = "0.14"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm", "layout-cache", "std", "underline-color"] }
regex = "1"
roxmltree = "0.21"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustc-demangle = "0.1.28"
rustc-hash = "2"
rustix = { version = "1.1", features = ["event", "fs", "process"] }
schemars = { version = "1", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.11.0"
# Pin the upstream fix for RUSTSEC-2026-0459 until SQLx releases support for
# libsqlite3-sys 0.39. Remove the Git source when that release is available.
# Omit the registry version so Cargo rejects publication instead of replacing
# the security fix with a vulnerable registry release.
sqlx = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tachyonfx = { version = "0.25.2", default-features = false, features = ["std"] }
tempfile = "3.27"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["local-offset", "std"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-segmentation = "1.13"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.18"
wiremock = "0.6.5"
x11rb = "0.14"

[workspace.lints.rust]
unsafe_code = "deny"
dead_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
# Keep noise low
must_use_candidate = "allow"

# High-signal safety/correctness
unwrap_used = "warn"
expect_used = "warn"
get_unwrap = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
panic = "deny"
exit = "warn"
rc_mutex = "warn"
rc_buffer = "warn"

# Practical cleanup/perf
redundant_clone = "warn"
unused_async = "warn"
unused_peekable = "warn"
debug_assert_with_mut_call = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
codegen-units = 1 # Allows compiler to perform better optimization.
lto = true # Enables Link-time Optimization.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true # Ensures debug symbols are removed.

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
