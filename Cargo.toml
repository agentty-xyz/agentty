[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.19.7"
authors = [
  "Vladimir Minev <minev.dev@gmail.com>",
  "Andrei Agaev <andagaev@gmail.com>",
]
edition = "2024"
license = "Apache-2.0"
description = "Agentty is an ADE (Agentic Development Environment) for structured, controllable AI-assisted software development."
repository = "https://github.com/agentty-xyz/agentty"

[workspace.dependencies]
ag-agent = { path = "crates/ag-agent", version = "0.19.7" }
ag-contracts = { path = "crates/ag-contracts", version = "0.19.7" }
ag-clipboard = { path = "crates/ag-clipboard", version = "0.19.7" }
ag-forge = { path = "crates/ag-forge", version = "0.19.7" }
ag-git = { path = "crates/ag-git", version = "0.19.7" }
ag-harness = { path = "crates/ag-harness", version = "0.19.7", default-features = false }
ag-protocol = { path = "crates/ag-protocol", version = "0.19.7" }
ag-remote = { path = "crates/ag-remote", version = "0.19.7" }
ag-runtime = { path = "crates/ag-runtime", version = "0.19.7" }
ag-router = { path = "crates/ag-router", version = "0.19.7" }
ag-scheduler = { path = "crates/ag-scheduler", version = "0.19.7" }
ag-session = { path = "crates/ag-session", version = "0.19.7" }
ag-store = { path = "crates/ag-store", version = "0.19.7" }
ag-telemetry = { path = "crates/ag-telemetry", version = "0.19.7", default-features = false }
ag-tui-text = { path = "crates/ag-tui-text", version = "0.19.7" }
ag-worker = { path = "crates/ag-worker", version = "0.19.7" }
testty = { path = "crates/testty", version = "0.19.7" }
async-trait = "0.1"
anyhow = "1"
assert_cmd = "2"
askama = "0.16.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
close_fds = "0.3.2"
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
fastrand = "2.3"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
hex = "0.4.3"
httpdate = "1.0.3"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
jsonschema = { version = "0.61.0", default-features = false }
libc = "0.2"
libproc = "0.15.0"
mockall = "0.15"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["internal-logs", "metrics", "trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["internal-logs", "metrics", "trace"] }
percent-encoding = "2"
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
portable-pty = "0.9"
prost = "0.14"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm", "layout-cache", "std", "underline-color"] }
regex = "1"
roxmltree = "0.21"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustc-demangle = "0.1.28"
rustc-hash = "2"
rustix = { version = "1.1", features = ["event", "fs", "process"] }
schemars = { version = "1", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.11.0"
snow = { version = "0.10", default-features = false, features = ["std", "use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }
sqlx = { version = "0.9.1", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tachyonfx = { version = "0.25.2", default-features = false, features = ["std"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["local-offset", "std"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tokio-util = { version = "0.7", default-features = false }
toml = { version = "1.2", default-features = false, features = ["parse", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-segmentation = "1.13"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.18"
wiremock = "0.6.5"
x11rb = "0.14"

[workspace.lints.rust]
unsafe_code = "deny"
dead_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -2 }
# Keep noise low
must_use_candidate = "allow"

# High-signal safety/correctness
unwrap_used = "warn"
expect_used = "warn"
get_unwrap = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
panic = "deny"
exit = "warn"
rc_mutex = "warn"
rc_buffer = "warn"

# Repository conventions enforced instead of documented
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
ignore_without_reason = "warn"
min_ident_chars = "warn"
mod_module_files = "warn"

# Practical cleanup/perf
redundant_clone = "warn"
unused_async = "warn"
unused_peekable = "warn"
debug_assert_with_mut_call = "warn"

# Release configuration read by `crates/ag-release`, which
# `.github/workflows/release.yml` runs; see `crates/ag-release/README.md`.
# Linux glibc builds run on Ubuntu 26.04. Their binaries reference glibc 2.34
# symbols, plus 2.39 `pidfd` functions that Rust links weakly and does without,
# so they run on Ubuntu 22.04's glibc 2.35, which the dry run's install test
# checks. Installers fall back to the statically linked musl builds on older
# glibc and on musl systems such as Alpine. Both macOS targets build on the
# Apple Silicon `macos-26` runner.
[workspace.metadata.release]
profile = "dist"
min-glibc = "2.35"
installers = ["shell", "homebrew", "npm", "binstall"]
homebrew-tap = "agentty-xyz/tap"
include = ["README.md", "LICENSE", "CHANGELOG.md"]

[workspace.metadata.release.targets]
aarch64-apple-darwin = "macos-26"
x86_64-apple-darwin = "macos-26"
aarch64-unknown-linux-gnu = "ubuntu-26.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-26.04"
aarch64-unknown-linux-musl = "ubuntu-26.04-arm"
x86_64-unknown-linux-musl = "ubuntu-26.04"

# Homebrew wants descriptions under 80 characters that do not start with the
# formula name, unlike the shared package description.
[workspace.metadata.release.apps.agentty]
homebrew-description = "Agentic development environment for structured, controllable AI coding"

[workspace.metadata.release.apps.testty]
homebrew-description = "PTY-driven end-to-end testing framework and CLI for terminal UIs"
npm-scope = "@agentty-xyz"

# `ag-release workflow` generates `.github/workflows/release.yml` from these
# settings; `ag-release` itself is built from this workspace.
[workspace.metadata.release.workflow]
node-version = "24.x"
smoke-paths = [".github/workflows/publish-npm-oidc.yml"]

# The dry run's install test: "" must install and run; other values are text
# the installer's failure must contain.
[workspace.metadata.release.workflow.distributions]
"ubuntu:26.04" = ""
"ubuntu:24.04" = ""
"ubuntu:22.04" = ""
"debian:stable-slim" = ""
"fedora:45" = ""
"ubuntu:20.04" = ""
"alpine:3.24" = ""
"i386/alpine:3.24" = "with a 32-bit userland"

[workspace.metadata.release.workflow.jobs.release-checks]
stage = "check"
uses = "$/.github/workflows/release-checks.yml"
permissions = { contents = "read" }

[workspace.metadata.release.workflow.jobs.publish-npm]
stage = "publish"
uses = "$/.github/workflows/publish-npm-oidc.yml"
permissions = { contents = "read", id-token = "write" }
plan = true

[workspace.metadata.release.workflow.jobs.publish-crates-io]
stage = "publish"
uses = "$/.github/workflows/publish-crates-io.yml"
permissions = { contents = "read", id-token = "write" }

# Pushes the formulas to `agentty-xyz/homebrew-tap` with that repository's
# write-access deploy key.
[workspace.metadata.release.workflow.jobs.publish-homebrew]
stage = "publish"
uses = "$/.github/workflows/publish-homebrew.yml"
permissions = { contents = "read" }
plan = true
secrets = ["HOMEBREW_TAP_DEPLOY_KEY"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
codegen-units = 1 # Allows compiler to perform better optimization.
lto = true # Enables Link-time Optimization.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true # Ensures debug symbols are removed.

# The profile `ag-release build` uses for published release binaries.
[profile.dist]
inherits = "release"
lto = "thin"
