name: Setup ag-release
description: Install the pinned Rust toolchain and put an `ag-release` built from this checkout on `PATH`.

runs:
  using: composite
  steps:
    - name: Install pinned Rust nightly toolchain
      shell: bash
      run: rustup toolchain install --profile minimal --no-self-update

    # Release jobs restore no build cache, so a release cannot read state that
    # another workflow wrote. The binary goes next to `cargo`, a directory that
    # is on `PATH` on every runner image; `~/.cargo/bin` does not exist on macOS
    # runners.
    - name: Build `ag-release`
      shell: bash
      run: |
        cargo build --locked --quiet --package ag-release
        cp target/debug/ag-release "$(dirname "$(command -v cargo)")/"
