name: Run Agentty Coverage
description: Generate, scan, summarize, and upload the workspace coverage report.

inputs:
  sonar-token:
    description: SonarQube token used when the event is allowed to scan.
    required: false
  summarize:
    description: Write LCOV totals to the GitHub Actions run summary.
    required: false
    default: "false"
  trunk-token:
    description: Trunk organization API token used to upload test results.
    required: false

runs:
  using: composite
  steps:
    - name: Setup Rust and `prek`
      id: rust-setup
      uses: $/.github/actions/setup-rust-prek
      with:
        cargo-llvm-cov: "true"
        llvm-tools-preview: "true"

    - name: Install native sandbox coverage dependency
      if: runner.os == 'Linux'
      uses: $/.github/actions/setup-native-sandbox

    - name: Check timing collector and generate JavaScript coverage
      shell: bash
      run: prek run test-timing-action --all-files

    - name: Prepare coverage timing reports
      uses: $/.github/actions/test-timing
      with:
        phase: prepare
        suite: coverage-test-results
        build-directory: target/llvm-cov-target
        exact-cache-hit: ${{ steps.rust-setup.outputs.exact-cache-hit }}

    - name: Generate and check coverage report
      id: coverage
      shell: bash
      run: prek run coverage --all-files --hook-stage manual

    # The PTY E2E suite is not checked: each scenario takes seconds by design.
    - name: Report slow tests and reject new ones
      shell: bash
      run: prek run check-slow-tests --all-files --hook-stage manual

    # Keep the report after a failed gate so platform-specific gaps can be
    # diagnosed locally with `ag-xtask check-coverage`.
    - name: Retain coverage report
      if: ${{ !cancelled() && hashFiles('coverage.lcov') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-lcov-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        path: coverage.lcov
        if-no-files-found: error
        retention-days: 7

    - name: Retain coverage test timings
      if: ${{ always() }}
      uses: $/.github/actions/upload-test-results
      with:
        name: coverage-test-results
        build-directory: target/llvm-cov-target
        outcome: ${{ steps.coverage.outcome }}

    - name: Upload coverage test results to Trunk
      if: ${{ !cancelled() && inputs.trunk-token != '' }}
      continue-on-error: true
      uses: trunk-io/analytics-uploader@a86313c7029d22e6ea2d5c346060a224d90053dc # v2.1.6
      env:
        TRUNK_API_TOKEN: ${{ inputs.trunk-token }}
      with:
        junit-paths: target/nextest/ci/junit.xml
        org-slug: agentty
        previous-step-outcome: ${{ steps.coverage.outcome }}
        token: ${{ inputs.trunk-token }}

    # The scanner CLI, its provisioned JRE, and analyzer plugins are otherwise
    # downloaded on every run. Only `main` saves the cache so pull requests
    # reuse one shared entry.
    - name: Restore SonarQube scanner cache
      id: sonar-cache
      if: ${{ !cancelled() && hashFiles('coverage.lcov') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: sonar-${{ runner.os }}-${{ runner.arch }}-v1
        path: |
          ~/.sonar/cache
          ${{ runner.tool_cache }}/sonar-scanner-cli

    - name: SonarQube Scan
      id: sonar-scan
      if: ${{ !cancelled() && hashFiles('coverage.lcov') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      with:
        # A pull request waits for its quality gate, so a failed gate fails
        # the scan and the analysis is complete before its issues are counted.
        args: ${{ github.event_name == 'pull_request' && '-Dsonar.qualitygate.wait=true' || '' }}

    # The built-in quality gate grades new code by rating, which still passes
    # a pull request that adds issues. Any open issue fails the job instead.
    - name: Reject pull request SonarQube issues
      id: sonar-issues
      if: ${{ !cancelled() && steps.sonar-scan.outcome == 'success' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        PULL_REQUEST: ${{ github.event.pull_request.number }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      run: |
        # Fail when the pull request analysis counts an unresolved issue.
        project_key="$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)"
        sonar_get() {
          curl --fail-with-body --silent --show-error --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "pullRequest=${PULL_REQUEST}" "$@"
        }
        # The analysis itself computes this count. A missing analysis or
        # measure fails the request or the filter instead of reading as zero.
        measures="$(sonar_get --data-urlencode "component=${project_key}" \
          --data-urlencode 'metricKeys=new_violations' \
          https://sonarcloud.io/api/measures/component)"
        total="$(jq --exit-status --raw-output '
          .component.measures[] | select(.metric == "new_violations") | .periods[0].value | tonumber
        ' <<<"$measures")" || {
          echo "::error::SonarQube returned no new-issue count for pull request #${PULL_REQUEST}."
          exit 1
        }
        if [ "$total" -eq 0 ]; then
          echo "SonarQube reports no open issues in pull request #${PULL_REQUEST}."
          exit 0
        fi
        issues="$(sonar_get --data-urlencode "componentKeys=${project_key}" \
          --data-urlencode 'issueStatuses=OPEN,CONFIRMED' --data-urlencode 'ps=500' \
          https://sonarcloud.io/api/issues/search)"
        jq --raw-output '
          .issues[]
          | "::error file=\(.component | sub("^[^:]*:"; "")),line=\(.line // 1),title=SonarQube issue::"
            + ("\(.message) (\(.rule))" | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A"))
        ' <<<"$issues"
        echo "::error::SonarQube reports ${total} open issue(s) in this pull request. Fix each one: https://sonarcloud.io/project/issues?id=${project_key}&pullRequest=${PULL_REQUEST}&issueStatuses=OPEN,CONFIRMED"
        exit 1

    - name: Save SonarQube scanner cache
      if: ${{ steps.sonar-scan.outcome == 'success' && steps.sonar-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.sonar-cache.outputs.cache-primary-key }}
        path: |
          ~/.sonar/cache
          ${{ runner.tool_cache }}/sonar-scanner-cli

    - name: Summarize coverage
      if: ${{ inputs.summarize == 'true' && !cancelled() && hashFiles('coverage.lcov') != '' }}
      shell: bash
      run: |
        # Summarize LCOV totals in the GitHub Actions run summary.
        awk '
          BEGIN {
            print "## Test coverage"
            print ""
            print "| Metric | Covered | Total | Coverage |"
            print "| --- | ---: | ---: | ---: |"
          }
          /^LF:/ { lines += substr($0, 4) }
          /^LH:/ { covered_lines += substr($0, 4) }
          /^FNF:/ { functions += substr($0, 5) }
          /^FNH:/ { covered_functions += substr($0, 5) }
          /^BRF:/ { branches += substr($0, 5) }
          /^BRH:/ { covered_branches += substr($0, 5) }
          END {
            report("Lines", covered_lines, lines)
            report("Functions", covered_functions, functions)
            if (branches > 0) {
              report("Branches", covered_branches, branches)
            }
          }
          function report(label, covered, total) {
            coverage = total == 0 ? "n/a" : sprintf("%.2f%%", covered * 100 / total)
            printf "| %s | %d | %d | %s |\n", label, covered, total, coverage
          }
        ' coverage.lcov >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      if: ${{ !cancelled() && hashFiles('coverage.lcov') != '' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        fail_ci_if_error: true
        files: coverage.lcov
        use_oidc: true
