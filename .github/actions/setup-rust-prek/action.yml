name: Setup Rust Prek Workspace
description: Install the shared Rust and `prek` CI tooling after checkout.

inputs:
  linux-isolation-tests:
    description: Install prerequisites and isolate temporary paths for native ag-harness tests.
    required: false
    default: "false"
  cargo-audit:
    description: Install `cargo-audit` for dependency advisory checks.
    required: false
    default: "false"
  cargo-llvm-cov:
    description: Install `cargo-llvm-cov` for coverage-producing jobs.
    required: false
    default: "false"
  cargo-machete:
    description: Install `cargo-machete` for unused dependency checks.
    required: false
    default: "false"
  llvm-tools-preview:
    description: Install the Rust `llvm-tools-preview` component for coverage-producing jobs.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install native Linux isolation test requirements
      if: runner.os == 'Linux' && inputs['linux-isolation-tests'] == 'true'
      shell: sh
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y bubblewrap musl-tools
        # Ubuntu's AppArmor userns restriction blocks bubblewrap's network setup.
        # Change only disposable hosted runners that opted into native tests.
        if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ] &&
           [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        timeout 10s bwrap --unshare-user --unshare-ipc --unshare-pid \
          --unshare-net --unshare-uts --unshare-cgroup --die-with-parent \
          --ro-bind / / -- /usr/bin/true
        mkdir -p "$GITHUB_WORKSPACE/target/native-tmp"
        echo "TMPDIR=$GITHUB_WORKSPACE/target/native-tmp" >> "$GITHUB_ENV"
        echo "GIT_CEILING_DIRECTORIES=$GITHUB_WORKSPACE/target/native-tmp" >> "$GITHUB_ENV"
        echo "AGENTTY_ROOT=$GITHUB_WORKSPACE/target/test-agentty" >> "$GITHUB_ENV"

    - name: Setup `uv`
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        # This Rust workspace uses `uv` only to install `prek`, so there is no
        # Python dependency manifest that can safely invalidate the `uv` cache.
        enable-cache: "false"

    - name: Install `prek`
      shell: bash
      env:
        UV_TOOL_BIN_DIR: /tmp/agentty-uv-tools/bin
      # Pin `prek`, require wheels so CI does not run package build hooks, and
      # expose the installed executable from a fixed trusted path to workflow
      # steps that run hooks.
      run: |
        mkdir -p "$UV_TOOL_BIN_DIR"
        uv tool install --no-build prek==0.4.14
        echo "/tmp/agentty-uv-tools/bin" >> "$GITHUB_PATH"

    - name: Install pinned Rust nightly toolchain
      shell: bash
      run: rustup toolchain install --profile minimal --no-self-update

    - name: Install Rust lint and format components
      shell: bash
      run: rustup component add clippy rustfmt

    - name: Install Rust LLVM tools
      if: ${{ inputs['llvm-tools-preview'] == 'true' }}
      shell: bash
      run: rustup component add llvm-tools-preview

    - name: Install `cargo-llvm-cov`
      if: ${{ inputs['cargo-llvm-cov'] == 'true' }}
      uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
      with:
        tool: cargo-llvm-cov

    - name: Install `cargo-audit`
      if: ${{ inputs['cargo-audit'] == 'true' }}
      uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
      with:
        tool: cargo-audit

    - name: Install `cargo-machete`
      if: ${{ inputs['cargo-machete'] == 'true' }}
      uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
      with:
        tool: cargo-machete

    - name: Install `cargo-nextest`
      uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
      with:
        tool: nextest

    - name: Restore Rust cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
