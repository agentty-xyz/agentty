name: Setup Rust Prek Workspace
description: Install the shared Rust and `prek` CI tooling after checkout.

inputs:
  cargo-audit:
    description: Install `cargo-audit` for dependency advisory checks.
    required: false
    default: "false"
  cargo-llvm-cov:
    description: Install `cargo-llvm-cov` for coverage-producing jobs.
    required: false
    default: "false"
  cargo-machete:
    description: Install `cargo-machete` for unused dependency checks.
    required: false
    default: "false"
  llvm-tools-preview:
    description: Install the Rust `llvm-tools-preview` component for coverage-producing jobs.
    required: false
    default: "false"

outputs:
  exact-cache-hit:
    description: Raw rust-cache exact-hit flag; false can mean a partial restore or miss.
    value: ${{ steps.rust-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Setup `uv`
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        # This Rust workspace uses `uv` only to install `prek`, so there is no
        # Python dependency manifest that can safely invalidate the `uv` cache.
        enable-cache: "false"

    - name: Install `prek`
      shell: bash
      env:
        UV_TOOL_BIN_DIR: /tmp/agentty-uv-tools/bin
      # Pin `prek`, require wheels so CI does not run package build hooks, and
      # expose the installed executable from a fixed trusted path to workflow
      # steps that run hooks.
      run: |
        mkdir -p "$UV_TOOL_BIN_DIR"
        uv tool install --no-build prek==0.4.14
        echo "/tmp/agentty-uv-tools/bin" >> "$GITHUB_PATH"

    - name: Install pinned Rust nightly toolchain
      shell: bash
      run: rustup toolchain install --profile minimal --no-self-update

    - name: Install Rust lint and format components
      shell: bash
      run: rustup component add clippy rustfmt

    - name: Install Rust LLVM tools
      if: ${{ inputs['llvm-tools-preview'] == 'true' }}
      shell: bash
      run: rustup component add llvm-tools-preview

    - name: Install `cargo-llvm-cov`
      if: ${{ inputs['cargo-llvm-cov'] == 'true' }}
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: cargo-llvm-cov

    - name: Install `cargo-audit`
      if: ${{ inputs['cargo-audit'] == 'true' }}
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: cargo-audit

    - name: Install `cargo-machete`
      if: ${{ inputs['cargo-machete'] == 'true' }}
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: cargo-machete

    - name: Install `cargo-nextest`
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: nextest

    - name: Restore Rust cache
      id: rust-cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        # PRs restore main's cache without uploading competing archives that
        # other PRs cannot read and that evict main's entries.
        save-if: ${{ github.ref == 'refs/heads/main' }}
