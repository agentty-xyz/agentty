name: Upload Test Results
description: Retain nextest execution timings and Cargo compilation timings.

inputs:
  name:
    description: Unique artifact name for the test job.
    required: true
  build-directory:
    description: Cargo target directory containing the compilation timing report.
    required: false
    default: target

runs:
  using: composite
  steps:
    - name: Upload test and compilation reports
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: |
          target/nextest/ci/junit.xml
          ${{ inputs.build-directory }}/cargo-timings/cargo-timing.html
        if-no-files-found: ignore
        retention-days: 14
