# CodeQL default setup reads this file only while the repository's
# `github-codeql-config-file` custom property names it; without the property
# it has no effect. Set the property to
# `remote=agentty-xyz/agentty@main:.github/codeql/codeql-config.yml`: default
# setup analyzes a pull request's head commit and fails when a local path is
# missing there, while the `remote=` form always reads the copy on `main`.
name: Agentty CodeQL configuration

# Analyze production code only. Tests are about two thirds of the Rust
# sources, and the Rust analysis is the slowest check on a pull request.
# The patterns follow `sonar.exclusions` in `sonar-project.properties`, but
# name the Rust and JavaScript files under `tests/` instead of the whole
# directory: `crates/ag-harness/tests/sandbox_fixture.c` is the only C source,
# and the C/C++ analysis fails when it finds no source to analyze.
paths-ignore:
  - "**/*_test.rs"
  - "**/tests.rs"
  - "**/tests/**/*.rs"
  - "**/tests/**/*.mjs"
  - "**/benches/**"
  - "**/*.test.mjs"
