name: Presubmit

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  coverage:
    name: SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust and `prek`
        uses: ./.github/actions/setup-rust-prek
        with:
          cargo-llvm-cov: "true"
          llvm-tools-preview: "true"

      - name: Generate and check coverage report
        run: prek run coverage --all-files --hook-stage manual

      - name: SonarQube Scan
        if: ${{ !cancelled() && hashFiles('coverage.lcov') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage.lcov') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          files: coverage.lcov
          use_oidc: true

  e2e:
    name: End-to-end feature tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust and `prek`
        uses: ./.github/actions/setup-rust-prek

      - name: Run end-to-end feature suite
        run: prek run test-agentty-e2e --all-files --hook-stage manual

  validate:
    name: Workspace checks
    uses: ./.github/workflows/workspace-validation.yml
    with:
      cargo-audit: true
      cargo-machete: true
      workspace-tests: true
