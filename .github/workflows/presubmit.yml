name: Presubmit

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Only a newer revision of the same PR supersedes an existing validation run.
# Unique groups preserve merge-queue runs, including different candidate heads.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Match postsubmit: `rust-cache` hashes `CARGO_*` variables into its key, so a
# difference here would stop pull requests from restoring caches saved on `main`.
env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate and publish coverage
        uses: $/.github/actions/run-coverage
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          trunk-token: ${{ secrets.TRUNK_API_TOKEN }}

  e2e:
    name: End-to-end feature tests
    uses: $/.github/workflows/e2e.yml
    secrets:
      TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}

  version-bump:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The first parent is the target branch for a pull request's merge
          # commit and for a merge-queue candidate.
          fetch-depth: 2
          persist-credentials: false

      - name: Compare the workspace version with the base
        id: version
        run: |
          workspace_version() {
            git show "$1:Cargo.toml" |
              awk '/^\[/ { package = ($0 == "[workspace.package]") } package && /^version *=/ { print; exit }'
          }

          changed=false
          if [ "$(workspace_version HEAD^1)" != "$(workspace_version HEAD)" ]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # Release preparation: a version bump packages every published crate and
  # checks its API against crates.io before the release tag exists.
  published-crates:
    name: Published crates
    needs: version-bump
    if: ${{ needs.version-bump.outputs.changed == 'true' }}
    uses: $/.github/workflows/published-crates.yml

  validate:
    name: Workspace checks
    uses: $/.github/workflows/workspace-validation.yml
    with:
      cargo-audit: true
      cargo-machete: true
