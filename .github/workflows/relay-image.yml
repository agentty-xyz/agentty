name: Relay Image

# Builds the remote-control relay's container image and checks that it starts,
# answers the health probe, and serves the pairing page. Nothing is published.
on:
  # Pull requests skip the build unless they touch the image definition, the
  # relay, a crate or the web client it embeds, or shared build configuration.
  pull_request:
    paths:
      - .containerignore
      - .github/actions/setup-rust-prek/**
      - .github/workflows/relay-image.yml
      - .pre-commit-config.yaml
      - Cargo.lock
      - Cargo.toml
      - container/relay.Containerfile
      - crates/ag-noise/**
      - crates/ag-relay/**
      - crates/ag-remote/assets/**
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

# A newer revision of the same PR supersedes an obsolete run. Manual runs keep
# independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Relay image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust and `prek`
        uses: $/.github/actions/setup-rust-prek
      - name: Build and probe the relay image
        run: prek run relay-image --all-files --hook-stage manual
