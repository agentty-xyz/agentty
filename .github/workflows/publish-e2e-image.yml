name: Publish E2E Image
run-name: Publish E2E image from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions: {}

env:
  E2E_REPOSITORY: ghcr.io/agentty-xyz/agentty-e2e

concurrency:
  group: publish-e2e-image
  cancel-in-progress: false

jobs:
  require-default-branch:
    name: Require default branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify selected branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: test "$SELECTED_BRANCH" = "$DEFAULT_BRANCH"

  build:
    name: Build and test (${{ matrix.platform }})
    needs: require-default-branch
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            runner_arch: X64
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # Each matrix leg sets only its architecture's digest; matrix job
    # outputs are combined, and the publish job asserts both are present.
    outputs:
      digest_amd64: ${{ steps.push.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.push.outputs.digest_arm64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Build candidate image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          candidate_image="${E2E_REPOSITORY}:build-${ARCHITECTURE}"
          podman build \
            --platform "$PLATFORM" \
            --tag "$candidate_image" \
            --file container/e2e.Containerfile \
            container
          test "$(podman image inspect --format '{{.Architecture}}' "$candidate_image")" = "$ARCHITECTURE"
          # Record the image ID so later steps run and push this exact
          # build instead of re-resolving the mutable tag. Guard against
          # an empty ID: a substitution failure inside `echo` would
          # otherwise be masked and only fail steps later.
          candidate_image_id=$(podman image inspect --format '{{.Id}}' "$candidate_image")
          test -n "$candidate_image_id"
          echo "CANDIDATE_IMAGE_ID=$candidate_image_id" >> "$GITHUB_ENV"

      - name: Run end-to-end feature suite
        run: |
          # `cargo-nextest` creates its store dir under the workspace root
          # (not `CARGO_TARGET_DIR`) whenever the profile configures JUnit
          # output, so give it a discardable tmpfs above the read-only mount.
          # The mountpoint must pre-exist inside the read-only bind source,
          # and mode 1777 keeps the tmpfs writable for the image's
          # unprivileged `agentty` user.
          mkdir -p "$GITHUB_WORKSPACE/target"
          # Run the recorded image ID, not the tag: `podman run --platform`
          # once re-pulled the tag from the registry, replacing the
          # just-built candidate with a previously published `build-*`
          # image. The build step already asserts the architecture.
          podman run --rm \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace,readonly=true \
            --mount type=tmpfs,destination=/workspace/target,tmpfs-mode=1777 \
            --env CARGO_TARGET_DIR=/tmp/target \
            "$CANDIDATE_IMAGE_ID" \
            prek run test-agentty-e2e --all-files --hook-stage manual

      - name: Authenticate with GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Push candidate image
        id: push
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          candidate_image="${E2E_REPOSITORY}:build-${ARCHITECTURE}"
          digest_file=$(mktemp)
          trap 'rm -f "$digest_file"' EXIT
          podman push --digestfile "$digest_file" \
            "$CANDIDATE_IMAGE_ID" "docker://${candidate_image}"
          # Record the pushed digest so the publish job assembles the
          # manifest from the tested images by identity instead of
          # re-resolving the mutable `build-*` tags.
          digest=$(sed -n '1p' "$digest_file")
          test -n "$digest"
          echo "digest_${ARCHITECTURE}=$digest" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish and verify manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Authenticate with GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Assemble manifest
        env:
          DIGEST_AMD64: ${{ needs.build.outputs.digest_amd64 }}
          DIGEST_ARM64: ${{ needs.build.outputs.digest_arm64 }}
        run: |
          # Assemble from the digests the build jobs pushed, not the
          # mutable `build-*` tags: a tag re-resolution here could
          # publish images other than the ones the build jobs tested.
          test -n "$DIGEST_AMD64"
          test -n "$DIGEST_ARM64"
          podman manifest create "${E2E_REPOSITORY}:latest"
          podman manifest add \
            "${E2E_REPOSITORY}:latest" \
            "docker://${E2E_REPOSITORY}@${DIGEST_AMD64}"
          podman manifest add \
            "${E2E_REPOSITORY}:latest" \
            "docker://${E2E_REPOSITORY}@${DIGEST_ARM64}"

      - name: Publish manifest
        id: publish
        run: |
          digest_file=$(mktemp)
          trap 'rm -f "$digest_file"' EXIT
          podman manifest push --all \
            --digestfile "$digest_file" \
            "${E2E_REPOSITORY}:latest" \
            "docker://${E2E_REPOSITORY}:latest"
          digest=$(sed -n '1p' "$digest_file")
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Log out before anonymous verification
        run: podman logout ghcr.io

      - name: Verify published manifest
        env:
          PUBLISHED_IMAGE: ${{ env.E2E_REPOSITORY }}@${{ steps.publish.outputs.digest }}
        run: |
          skopeo inspect --raw "docker://${PUBLISHED_IMAGE}" | jq -e '
            (.mediaType == "application/vnd.oci.image.index.v1+json"
              or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json")
            and ([
              .manifests[].platform
              | select(.os == "linux")
              | .architecture
            ] | unique | sort == ["amd64", "arm64"])
          '
          podman pull --platform linux/amd64 "$PUBLISHED_IMAGE"
          podman pull --platform linux/arm64 "$PUBLISHED_IMAGE"

      - name: Report published digest
        env:
          PUBLISHED_IMAGE: ${{ env.E2E_REPOSITORY }}@${{ steps.publish.outputs.digest }}
        run: |
          printf '## Published E2E image\n\n`%s`\n' "$PUBLISHED_IMAGE" >> "$GITHUB_STEP_SUMMARY"
