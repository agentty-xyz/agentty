name: GitHub Actions Security Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: blacksmith-4vcpu-ubuntu-2604
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          persona: regular
