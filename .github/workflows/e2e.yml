name: Agentty E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run suite
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target
    container:
      image: ghcr.io/agentty-xyz/agentty-e2e@sha256:a72f0ec28f53b2746b3b3cd224aaa1e511e555c6a1b5c2bbdfa21e79538e55f4
      # GitHub requires the default root user to access `GITHUB_WORKSPACE`.
      # Local recording still uses the image's unprivileged default user.
      options: --platform linux/amd64 --user 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure zstd cache compression
        # Bootstrap older pinned images; rebuilt images include zstd.
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends zstd
          fi

      - name: Restore E2E Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # This action ignores `key` when `shared-key` is set, so include
          # container and workflow changes in the effective shared prefix.
          shared-key: agentty-e2e-${{ hashFiles('container/e2e.Containerfile', '.github/workflows/e2e.yml') }}
          cache-bin: "false"
          cache-workspace-crates: "true"
          # PRs restore main's cache without uploading competing archives.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Prepare E2E timing reports
        uses: $/.github/actions/test-timing
        with:
          phase: prepare
          suite: e2e-test-results
          exact-cache-hit: ${{ steps.rust-cache.outputs.cache-hit }}
          container: ghcr.io/agentty-xyz/agentty-e2e@sha256:a72f0ec28f53b2746b3b3cd224aaa1e511e555c6a1b5c2bbdfa21e79538e55f4

      - name: Run end-to-end feature suite
        id: e2e-tests
        run: prek run test-agentty-e2e --all-files --hook-stage manual

      - name: Retain E2E test timings
        if: ${{ always() }}
        uses: $/.github/actions/upload-test-results
        with:
          name: e2e-test-results
          outcome: ${{ steps.e2e-tests.outcome }}
