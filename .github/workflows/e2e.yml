name: Agentty E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run suite
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target
    container:
      image: ghcr.io/agentty-xyz/agentty-e2e@sha256:a72f0ec28f53b2746b3b3cd224aaa1e511e555c6a1b5c2bbdfa21e79538e55f4
      # GitHub requires the default root user to access `GITHUB_WORKSPACE`.
      # Local recording still uses the image's unprivileged default user.
      options: --platform linux/amd64 --user 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore E2E Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: agentty-e2e
          key: ${{ hashFiles('container/e2e.Containerfile', '.github/workflows/e2e.yml') }}
          cache-bin: "false"
          cache-workspace-crates: "true"

      - name: Run end-to-end feature suite
        run: prek run test-agentty-e2e --all-files --hook-stage manual

      - name: Retain E2E test timings
        if: ${{ always() }}
        uses: $/.github/actions/upload-test-results
        with:
          name: e2e-test-results
