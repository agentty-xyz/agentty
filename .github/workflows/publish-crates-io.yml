name: Publish Crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          if [[ -z "$toolchain" ]]; then
            echo "Missing toolchain channel in rust-toolchain.toml" >&2
            exit 1
          fi
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust nightly toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish `ag-forge` to crates.io
        env:
          CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p ag-forge --token "$CRATES_IO_TOKEN"

      - name: Publish `ag-git` to crates.io
        env:
          CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p ag-git --token "$CRATES_IO_TOKEN"

      - name: Publish `testty` to crates.io
        env:
          CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p testty --token "$CRATES_IO_TOKEN"

      - name: Publish `ag-protocol` to crates.io
        env:
          CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p ag-protocol --token "$CRATES_IO_TOKEN"

      - name: Publish `ag-agent` to crates.io
        env:
          CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p ag-agent --token "$CRATES_IO_TOKEN"

      - name: Publish `ag-session` to crates.io
        env:
          CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p ag-session --token "$CRATES_IO_TOKEN"

      - name: Publish `ag-clipboard` to crates.io
        env:
          CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p ag-clipboard --token "$CRATES_IO_TOKEN"

      - name: Publish `ag-tui-text` to crates.io
        env:
          CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p ag-tui-text --token "$CRATES_IO_TOKEN"

      - name: Publish `agentty` to crates.io
        env:
          CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p agentty --token "$CRATES_IO_TOKEN"
