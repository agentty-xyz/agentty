name: Close inactive pull requests

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: close-inactive-prs
  cancel-in-progress: false

jobs:
  close-inactive-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write

    steps:
      - name: Close pull requests after 30 days without activity
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          remove-issue-stale-when-updated: false
          days-before-pr-stale: 30
          days-before-pr-close: 0
          stale-pr-message: ""
          close-pr-message: >-
            Closing this pull request after 30 days without activity.
            Please reopen it if you would like to continue working on it.
          delete-branch: false
          operations-per-run: 100
