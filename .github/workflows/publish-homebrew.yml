name: Publish Homebrew

# Pushes the Homebrew formulas of a release run to the tap that the plan names.
# `.github/workflows/release.yml` calls it after publishing the GitHub release,
# whose archives the formulas download.
on:
  workflow_call:
    inputs:
      plan:
        description: The `ag-release plan` JSON, which names the tap and each app's formula.
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        description: Fine-grained token with Contents read and write on the tap repository only.
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Fetch release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release/

      # The token stays configured for the push below and is scoped to the
      # tap, whose checkout no later step uploads.
      - name: Checkout the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 zizmor: ignore[artipacked]
        with:
          repository: ${{ fromJson(inputs.plan).homebrew_tap.repository }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Push the formulas
        shell: bash
        env:
          TAG: ${{ fromJson(inputs.plan).tag }}
        run: |
          mkdir -p tap/Formula
          jq --raw-output '.apps[].homebrew_formula // empty' <<< "$PLAN" > "$RUNNER_TEMP/formulas"
          while read -r formula; do
            cp "release/$formula" "tap/Formula/$formula"
          done < "$RUNNER_TEMP/formulas"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then
            echo "The formulas are already current."
            exit 0
          fi
          git commit --message "Update formulas to $TAG"
          git push

  # Installs every formula from the published tap as users do, and checks that
  # each binary reports the released version.
  verify:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    env:
      PLAN: ${{ inputs.plan }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: Install from the tap
        shell: bash
        run: |
          brew="$(command -v brew || echo /home/linuxbrew/.linuxbrew/bin/brew)"
          tap="$(jq --raw-output .homebrew_tap.name <<< "$PLAN")"
          version="$(jq --raw-output .version <<< "$PLAN")"
          jq --raw-output '.apps[] | select(.homebrew_formula) | [.name, (.binaries | join(" "))] | @tsv' \
            <<< "$PLAN" > "$RUNNER_TEMP/apps.tsv"
          while IFS=$'\t' read -r app binaries; do
            # `brew` reads standard input, which would consume the app list.
            "$brew" install "$tap/$app" < /dev/null
            for binary in $binaries; do
              reported="$("$("$brew" --prefix "$tap/$app")/bin/$binary" --version)"
              echo "$reported"
              grep -qF "$version" <<< "$reported"
            done
          done < "$RUNNER_TEMP/apps.tsv"
