name: Release Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/rust-validation.yml
    with:
      llvm-tools-preview: true
      workspace-tests: true

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust and `prek`
        uses: ./.github/actions/setup-rust-prek

      - name: Run end-to-end feature suite
        run: prek run test-agentty-e2e --all-files --hook-stage manual
