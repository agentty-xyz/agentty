name: Workspace Validation

on:
  workflow_call:
    inputs:
      cargo-audit:
        description: Run the dependency advisory audit hook.
        required: false
        type: boolean
        default: false
      cargo-machete:
        description: Run the unused dependency check hook.
        required: false
        type: boolean
        default: false
      llvm-tools-preview:
        description: Install the Rust `llvm-tools-preview` component.
        required: false
        type: boolean
        default: false
      workspace-tests:
        description: Run the full workspace source test suite hook.
        required: false
        type: boolean
        default: false
    secrets:
      TRUNK_API_TOKEN:
        description: Trunk organization API token used to upload test results.
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Workspace validation
    runs-on: blacksmith-4vcpu-ubuntu-2604
    env:
      TRUNK_API_TOKEN_AVAILABLE: ${{ secrets.TRUNK_API_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          # The first parent is the base the migration-edit check compares
          # against: the target branch for a pull request's merge commit.
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Rust and `prek`
        id: rust-setup
        uses: $/.github/actions/setup-rust-prek
        with:
          cargo-audit: ${{ inputs['cargo-audit'] && 'true' || 'false' }}
          cargo-machete: ${{ inputs['cargo-machete'] && 'true' || 'false' }}
          cargo-public-api: "true"
          llvm-tools-preview: ${{ inputs['llvm-tools-preview'] && 'true' || 'false' }}

      # The `design-gallery` hook compiles the docs site's stylesheet with Zola
      # and renders it in the runner's Google Chrome, offline.
      - name: Install Zola
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: zola@0.22.1

      # With every file selected, the `clippy` hook lints all workspace targets
      # and features plus Agentty's PTY suites, so it also type-checks them.
      - name: Default validation hooks
        env:
          AGENTTY_MIGRATION_BASE: HEAD^1
        run: prek run --all-files

      # Nextest runs no doctests, so rustdoc and README examples run here:
      # for pull requests and `main` only when the last commit touches a path
      # the hook's `files` pattern selects, and every time in release
      # validation.
      - name: Documentation examples
        env:
          DOCTEST_SCOPE: ${{ inputs['workspace-tests'] && '--all-files' || '--last-commit' }}
        run: prek run test-doc --hook-stage manual "$DOCTEST_SCOPE"

      # The published library APIs must match their reviewed snapshots.
      - name: Public API snapshots
        run: prek run public-api --hook-stage manual --all-files

      - name: Dependency advisory audit
        if: ${{ inputs['cargo-audit'] }}
        run: prek run cargo-audit --all-files --hook-stage manual

      - name: Unused dependency check
        if: ${{ inputs['cargo-machete'] }}
        run: prek run cargo-machete --all-files --hook-stage manual

      - name: Install native sandbox test dependency
        if: ${{ inputs['workspace-tests'] }}
        uses: $/.github/actions/setup-native-sandbox

      - name: Prepare workspace timing reports
        if: ${{ inputs['workspace-tests'] }}
        uses: $/.github/actions/test-timing
        with:
          phase: prepare
          suite: workspace-test-results
          exact-cache-hit: ${{ steps.rust-setup.outputs.exact-cache-hit }}

      - name: Full test suite
        id: workspace-tests
        if: ${{ inputs['workspace-tests'] }}
        run: prek run test-workspace --all-files --hook-stage manual

      - name: Retain workspace test timings
        if: ${{ always() && inputs['workspace-tests'] }}
        uses: $/.github/actions/upload-test-results
        with:
          name: workspace-test-results
          outcome: ${{ steps.workspace-tests.outcome }}

      - name: Upload workspace test results to Trunk
        if: ${{ !cancelled() && inputs['workspace-tests'] && env.TRUNK_API_TOKEN_AVAILABLE == 'true' }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@9886de74a788c450c793109577a4d97bfb3e799f # v2.1.8
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
        with:
          junit-paths: target/nextest/ci/junit.xml
          org-slug: agentty
          previous-step-outcome: ${{ steps.workspace-tests.outcome }}
          token: ${{ secrets.TRUNK_API_TOKEN }}
