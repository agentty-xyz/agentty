name: Native Harness Sandbox

# Linux sandbox qualification runs in the coverage job, which installs the same
# Bubblewrap setup and runs every `ag-harness` sandbox suite, so this workflow
# only qualifies the macOS launcher.
on:
  # Runs on `main` so its Rust caches exist for pull requests to restore.
  push:
    branches:
      - main
  # Pull requests skip qualification unless they touch `ag-harness`, a crate it
  # depends on, or shared build and CI configuration. Keep the crate list in
  # sync with `cargo tree -p ag-harness -e normal,build,dev`; `main` still runs
  # on every push.
  pull_request:
    paths:
      - .cargo/**
      - .config/nextest.toml
      - .github/actions/setup-rust-prek/**
      - .github/actions/test-timing/**
      - .github/actions/upload-test-results/**
      - .github/workflows/harness-sandbox.yml
      - .pre-commit-config.yaml
      - Cargo.lock
      - Cargo.toml
      - crates/ag-harness/**
      - crates/ag-router/**
      - crates/ag-telemetry/**
      - rust-toolchain.toml
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# A newer revision of the same PR, or a newer `main` push, supersedes an
# obsolete run. Merge queue and manual runs keep independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  native:
    name: Native sandbox (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust and prek
        id: rust-setup
        uses: $/.github/actions/setup-rust-prek
        with:
          cargo-llvm-cov: "true"
          llvm-tools-preview: "true"
      - name: Record qualification environment
        run: |
          uname -a
          rustc --version
      - name: Prepare native sandbox timing reports
        uses: $/.github/actions/test-timing
        with:
          phase: prepare
          suite: native-sandbox-test-results-macos
          build-directory: target/llvm-cov-target
          exact-cache-hit: ${{ steps.rust-setup.outputs.exact-cache-hit }}
      - name: Native sandbox public contract and launcher coverage
        id: sandbox-tests
        run: prek run coverage-ag-harness-sandbox --all-files --hook-stage manual
      - name: Retain native sandbox test timings
        if: ${{ always() }}
        uses: $/.github/actions/upload-test-results
        with:
          name: native-sandbox-test-results-macos
          build-directory: target/llvm-cov-target
          outcome: ${{ steps.sandbox-tests.outcome }}
