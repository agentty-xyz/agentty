name: Postsubmit

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep the active postsubmit run alive when newer pushes arrive.
  cancel-in-progress: false

jobs:
  source-tests:
    name: Source tests (${{ matrix.member }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - member: ag-forge
            hook: test-ag-forge-src
          - member: ag-git
            hook: test-ag-git-src
          - member: ag-protocol
            hook: test-ag-protocol-src
          - member: ag-tui-text
            hook: test-ag-tui-text-src
          - member: agentty
            hook: test-agentty-src
          - member: ag-xtask
            hook: test-ag-xtask-src
          - member: testty
            hook: test-testty-src

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust and `prek`
        uses: ./.github/actions/setup-rust-prek

      - name: Run source tests
        run: prek run ${{ matrix.hook }} --all-files --hook-stage manual

  validate:
    name: Workspace checks
    uses: ./.github/workflows/workspace-validation.yml
    with:
      cargo-audit: true
      cargo-machete: true

  coverage:
    name: SonarQube and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate and publish coverage
        uses: ./.github/actions/run-coverage
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          summarize: "true"

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run end-to-end feature suite
        uses: ./.github/actions/run-e2e
