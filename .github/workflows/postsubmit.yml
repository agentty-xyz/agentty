name: Postsubmit

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep the active postsubmit run alive when newer pushes arrive.
  cancel-in-progress: false

jobs:
  # One job runs the cataloged source hooks in turn. Each hook still builds
  # its own package's feature set, while dependencies compile once and the
  # run holds one runner instead of one per member.
  source-tests:
    name: Source tests
    runs-on: ubuntu-latest
    env:
      TRUNK_API_TOKEN_AVAILABLE: ${{ secrets.TRUNK_API_TOKEN != '' }}
      SOURCE_TEST_HOOKS: >-
        test-ag-agent-src
        test-ag-clipboard-src
        test-ag-contracts-src
        test-ag-forge-src
        test-ag-git-src
        test-ag-harness-src
        test-ag-harness-cli-src
        test-ag-protocol-src
        test-ag-session-src
        test-ag-store-src
        test-ag-tui-text-src
        test-agentty-src
        test-ag-xtask-src
        test-testty-src

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust and `prek`
        id: rust-setup
        uses: $/.github/actions/setup-rust-prek

      # Every hook rewrites the same JUnit and timing files, so each run's
      # fresh reports and provenance are retained under its hook ID. A failing
      # hook does not stop the remaining members. Resolving features per selected package overrides
      # the workspace unification in `.cargo/config.toml`, so a member that
      # relies on a feature only another member enables fails here.
      - name: Run source tests
        id: source-tests
        env:
          CARGO_RESOLVER_FEATURE_UNIFICATION: selected
          INPUT_EXACT-CACHE-HIT: ${{ steps.rust-setup.outputs.exact-cache-hit }}
        run: |
          status=0
          rm -rf target/test-results
          for hook in $SOURCE_TEST_HOOKS; do
            echo "::group::$hook"
            export INPUT_SUITE="$hook" INPUT_PHASE=prepare
            node .github/actions/test-timing/index.mjs
            outcome=success
            prek run "$hook" --all-files --hook-stage manual || { status=1; outcome=failure; }
            export INPUT_PHASE=finish INPUT_OUTCOME="$outcome"
            node .github/actions/test-timing/index.mjs
            echo "::endgroup::"
          done
          exit "$status"

      - name: Retain source test timings
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-test-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: target/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload source test results to Trunk
        if: ${{ !cancelled() && env.TRUNK_API_TOKEN_AVAILABLE == 'true' }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@a86313c7029d22e6ea2d5c346060a224d90053dc # v2.1.6
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}
        with:
          junit-paths: target/test-results/*/junit.xml
          org-slug: agentty
          previous-step-outcome: ${{ steps.source-tests.outcome }}
          token: ${{ secrets.TRUNK_API_TOKEN }}

  validate:
    name: Workspace checks
    uses: $/.github/workflows/workspace-validation.yml
    with:
      cargo-audit: true
      cargo-machete: true

  coverage:
    name: SonarQube and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate and publish coverage
        uses: $/.github/actions/run-coverage
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          summarize: "true"

  e2e:
    name: End-to-end feature tests
    uses: $/.github/workflows/e2e.yml
