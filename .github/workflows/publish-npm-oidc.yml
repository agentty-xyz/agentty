name: Publish npm

# Publishes the npm package tarballs of a release run with trusted publishing.
# `.github/workflows/release.yml` calls it after uploading the GitHub release,
# whose archives the packages download on install.
on:
  workflow_call:
    inputs:
      plan:
        description: The `ag-release plan` JSON, which names each app's npm tarball.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Fetch release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: npm/

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Publish npm packages
        shell: bash
        run: |
          jq --raw-output '.apps[].npm_tarball // empty' <<< "$PLAN" > "$RUNNER_TEMP/npm-tarballs"
          while read -r tarball; do
            # npm requires an explicit dist-tag when publishing a stable version
            # below a higher version that already exists in the registry.
            npm publish --access public --tag latest "./npm/$tarball"
          done < "$RUNNER_TEMP/npm-tarballs"
