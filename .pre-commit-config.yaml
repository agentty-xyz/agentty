default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=5120']
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: mdformat
        name: mdformat
        description: Format Markdown files.
        entry: mdformat
        language: python
        additional_dependencies:
          - mdformat==0.7.22
          - mdformat-front-matters==2.0.0
          - mdformat-gfm==1.0.0
        args: ['--wrap', '88']
        files: \.(md|markdown)$
      - id: djlint-reformat
        name: djlint reformat
        description: Format HTML files and embedded CSS blocks.
        entry: python -X cpu_count=1 -m djlint --reformat --format-css
        language: python
        additional_dependencies: [djlint==1.36.4]
        files: \.html?$
      - id: rustfmt-fix
        name: rustfmt fix
        description: Format Rust files changed since the fork from `origin/main`, or the whole workspace when formatter configuration or the toolchain changes.
        entry: cargo run -q --locked -p ag-xtask -- fmt
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-timing-action
        name: test timing artifact lifecycle
        description: Verify artifact freshness and provenance with complete JavaScript line coverage.
        entry: >-
          bash -eu -o pipefail -c 'rm -f timing-action.lcov;
          node --test --experimental-test-coverage --test-coverage-lines=100
          --test-coverage-include=.github/actions/test-timing/index.mjs
          --test-coverage-include=.github/actions/test-timing/timing.mjs
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=timing-action.lcov
          .github/actions/test-timing/timing.test.mjs && test -s timing-action.lcov'
        language: system
        files: ^(\.github/actions/test-timing/|\.pre-commit-config\.yaml$)
        pass_filenames: false
      - id: design-gallery-check-test
        name: design gallery check tests
        description: Test the exported design gallery check against a fake page and browser process, with complete JavaScript line coverage, and write its LCOV report for SonarQube.
        entry: >-
          bash -eu -o pipefail -c 'rm -f design-gallery-check.lcov;
          node --test --experimental-test-coverage --test-coverage-lines=100
          --test-coverage-include=design/gallery-check.mjs
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=design-gallery-check.lcov
          design/tests/gallery-check.test.mjs && test -s design-gallery-check.lcov'
        language: system
        files: ^(design/gallery-check\.mjs|design/tests/|\.pre-commit-config\.yaml$)
        pass_filenames: false
      - id: design-gallery
        name: design gallery
        description: Render `design/gallery.html` under each public surface's whole stylesheet chain, the docs site's stylesheet as Zola compiles it and the remote client's `/app.css`, in a local headless Chromium-based browser (`CHROME_PATH` or a usual install), and fail when a surface renders a shared component differently from the shared stylesheets alone or restyles one, including through a class its templates and scripts set beside a shared class.
        entry: >-
          bash -eu -o pipefail -c 'site="$(mktemp -d)"; trap "rm -rf \"$site\"" EXIT;
          zola --root docs/site build --output-dir "$site/public" >/dev/null;
          assets=crates/ag-remote/assets;
          node design/gallery-check.mjs design/gallery.html
          --surface "docs-site=$site/public/site.css"
          --markup "docs-site=docs/site/templates,docs/site/static"
          --surface "remote-client=$assets/tokens.css,$assets/fonts.css,$assets/base.css,$assets/app.css"
          --markup "remote-client=$assets"'
        language: system
        files: ^(design/|docs/site/(config\.toml|sass/|templates/|static/.*\.js$)|crates/ag-remote/assets/|crates/ag-remote/src/server\.rs$|crates/ag-relay/src/page\.rs$|\.pre-commit-config\.yaml$)
        pass_filenames: false
      - id: clippy-fix
        name: clippy fix
        description: Auto-fix clippy lints across Rust targets when a mechanical fix is available.
        entry: cargo clippy --fix --allow-dirty --allow-staged -q --all-targets --all-features -- -D warnings
        language: system
        files: (^|/)(Cargo\.toml|Cargo\.lock|.*\.rs)$
        pass_filenames: false
        stages: [manual]
      - id: rustfmt
        name: rustfmt check
        description: Verify the selected Rust files are already formatted with rustfmt, skipping child modules so each file is checked once.
        entry: rustfmt --check --config skip_children=true
        language: system
        types: [rust]
      - id: cargo-check-ag-harness-benchmark
        name: cargo check ag-harness benchmark
        description: Compile-check the manual ag-harness live benchmark without executing it.
        entry: cargo check -q --locked -p ag-harness --test benchmark
        language: system
        files: (^|/)(Cargo\.toml|Cargo\.lock|crates/ag-harness/(src/.*\.rs|tests/benchmark/.*\.rs))$
        pass_filenames: false
      - id: clippy
        name: clippy
        description: Lint affected packages across all targets and features, then Agentty's explicit PTY targets when affected; shared files select the workspace.
        entry: cargo run -q --locked -p ag-xtask -- clippy
        language: system
        files: (^|/)(Cargo\.toml|Cargo\.lock|.*\.rs)$
        require_serial: true
      - id: clippy-ag-harness-benchmark
        name: clippy ag-harness benchmark
        description: Lint the manual ag-harness live benchmark without executing it.
        entry: cargo clippy -q --locked -p ag-harness --test benchmark -- -D warnings
        language: system
        files: (^|/)(Cargo\.toml|Cargo\.lock|crates/ag-harness/(src/.*\.rs|tests/benchmark/.*\.rs))$
        pass_filenames: false
      - id: clippy-agentty-e2e
        name: clippy agentty e2e
        description: Lint Agentty PTY suites when Agentty or its dependencies change; shared files select them conservatively.
        entry: cargo run -q --locked -p ag-xtask -- clippy --agentty-e2e
        language: system
        files: (^|/)(Cargo\.toml|Cargo\.lock|.*\.rs)$
        require_serial: true
        stages: [manual]
      - id: cargo-check
        name: cargo check affected
        description: Compile-check affected packages and Clippy's PTY target selection without linting, to catch compile errors before tests; shared files select the workspace.
        entry: cargo run -q --locked -p ag-xtask -- clippy --check
        language: system
        files: (^|/)(Cargo\.toml|Cargo\.lock|.*\.rs)$
        require_serial: true
        stages: [manual]
      - id: test-workspace
        name: cargo nextest workspace
        description: Run workspace source and public API tests with `cargo-nextest`.
        entry: >-
          cargo nextest run --locked --timings --profile ci --workspace
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: prompt-evaluation
        name: live prompt behavior evaluation
        description: Run explicitly configured repeated provider cases through the production worker and runtime.
        entry: cargo test --locked -p agentty --test prompt_evaluation live_prompt_evaluation -- --ignored --exact --nocapture
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-focused
        name: cargo nextest focused
        description: Run selected tests with the fail-fast local profile, optionally compiling only AGENTTY_TEST_PACKAGES; Agentty PTY suites run only through `test-agentty-e2e`.
        entry: >-
          bash -eu -o pipefail -c 'package_args=(--workspace);
          if [[ -n "${AGENTTY_TEST_PACKAGES:-}" ]]; then
          set -f; packages=($AGENTTY_TEST_PACKAGES); set +f;
          if [[ ${#packages[@]} -eq 0 ]]; then
          echo "AGENTTY_TEST_PACKAGES must contain package names" >&2; exit 1; fi;
          package_args=();
          for package in "${packages[@]}"; do package_args+=(-p "$package"); done; fi;
          cargo nextest run --locked --timings --profile local "${package_args[@]}"
          --no-tests=fail -E "${AGENTTY_TEST_FILTER:?Set AGENTTY_TEST_FILTER to a nextest filterset}"'
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: validate
        name: coordinated affected-package validation
        description: Run cataloged clippy and focused tests for changed packages and dependents, with optional explicit package selection and build coordination.
        entry: cargo run --locked -q -p ag-xtask -- validate
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-forge-src
        name: cargo nextest ag-forge src
        description: Source tests for `crates/ag-forge/src`.
        entry: cargo nextest run --locked --timings --profile ci -p ag-forge --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-git-src
        name: cargo nextest ag-git src
        description: Source tests for `crates/ag-git/src`.
        entry: cargo nextest run --locked --timings --profile ci -p ag-git --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-harness-src
        name: cargo nextest ag-harness src and public contracts
        description: Source tests and public contracts for `ag-harness`.
        entry: cargo nextest run --locked --timings --profile ci -p ag-harness --lib --test public_api
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-harness-cli-src
        name: cargo nextest ag-harness-cli src
        description: Source tests for `crates/ag-harness-cli/src`.
        entry: cargo nextest run --locked --timings --profile ci -p ag-harness-cli --bin ag-harness
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-protocol-src
        name: cargo nextest ag-protocol src
        description: Source tests for `crates/ag-protocol/src`.
        entry: cargo nextest run --locked --timings --profile ci -p ag-protocol --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-release-src
        name: cargo nextest ag-release src
        description: Source tests for `crates/ag-release/src`.
        entry: cargo nextest run --locked --timings --profile ci -p ag-release --bin ag-release
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-clipboard-src
        name: cargo nextest ag-clipboard src
        description: Source tests for `crates/ag-clipboard/src`.
        entry: cargo nextest run --locked --timings --profile ci -p ag-clipboard --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-agent-src
        name: cargo nextest ag-agent src
        description: Source tests for `crates/ag-agent/src`.
        entry: cargo nextest run --locked --timings --profile ci -p ag-agent --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-contracts-src
        name: cargo nextest ag-contracts src
        description: Source tests for the provider-independent execution contracts.
        entry: cargo nextest run --locked --timings --profile ci -p ag-contracts --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-worker
        name: cargo nextest ag-worker
        description: Worker source tests and the public headless execution contract.
        entry: cargo nextest run --locked --timings --profile ci -p ag-worker
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-noise-src
        name: cargo nextest ag-noise src
        description: Source tests for `crates/ag-noise/src`.
        entry: cargo nextest run --locked --timings --profile ci -p ag-noise --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-remote
        name: cargo nextest ag-remote
        description: Remote control source tests and the public server contract.
        entry: cargo nextest run --locked --timings --profile ci -p ag-remote
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-relay
        name: cargo nextest ag-relay
        description: Relay source tests, the public relay contract, and its binary.
        entry: cargo nextest run --locked --timings --profile ci -p ag-relay
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-session-src
        name: cargo nextest ag-session src
        description: Source tests for `crates/ag-session/src`.
        entry: cargo nextest run --locked --timings --profile ci -p ag-session --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-store-src
        name: cargo nextest ag-store src
        description: Source tests for `crates/ag-store/src`.
        entry: cargo nextest run --locked --timings --profile ci -p ag-store --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-tui-text-src
        name: cargo nextest ag-tui-text src
        description: Source tests for `crates/ag-tui-text/src`.
        entry: cargo nextest run --locked --timings --profile ci -p ag-tui-text --lib
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-agentty-src
        name: cargo nextest agentty src
        description: Source tests for `crates/agentty/src`.
        entry: >-
          cargo nextest run --locked --timings --profile ci -p agentty --lib --bin agentty
          -E 'not (package(agentty) and kind(test))'
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-ag-xtask-src
        name: cargo nextest ag-xtask src
        description: Source tests for `crates/ag-xtask/src`.
        entry: cargo nextest run --locked --timings --profile ci -p ag-xtask --bin ag-xtask
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-testty-src
        name: cargo nextest testty src
        description: Source tests for `crates/testty/src`.
        entry: cargo nextest run --locked --timings --profile ci -p testty --lib --bins
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-agentty-e2e
        name: cargo nextest agentty e2e
        description: Agentty integration tests from `crates/agentty/tests`.
        entry: >-
          env TESTTY_GIF_MODE=check cargo nextest run --locked --timings --profile ci -p agentty
          --test protocol_compliance_e2e --test e2e
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: e2e-container
        name: agentty e2e in the pinned container
        description: Run or record Agentty feature tests, or re-record the marketing assets named by `AGENTTY_MARKETING_ASSETS`, in the pinned E2E image with Podman; concurrent local runs wait for the host lock.
        entry: cargo run -q --locked -p ag-xtask -- e2e-container
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: relay-image
        name: relay container image
        description: Build `container/relay.Containerfile` with Podman, run the image with an extra relay flag, and check that it answers the health probe and serves the pairing page.
        entry: >-
          bash -eu -o pipefail -c 'image=localhost/agentty-relay:check;
          podman build --file container/relay.Containerfile
          --ignorefile container/relay.containerignore --tag "$image" .;
          bash container/relay-probe.sh "$image"'
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: coverage
        name: coverage
        description: Generate coverage once from the `test-workspace` selection, write the CI LCOV report, and list every uncovered line and function; anything uncovered fails.
        entry: >-
          bash -eu -o pipefail -c 'rm -f coverage.lcov;
          coverage_rustflags="${RUSTFLAGS:-} -C llvm-args=-runtime-counter-relocation";
          case "$(uname -s)" in Darwin)
          coverage_rustflags="$coverage_rustflags
          -C link-arg=-Wl,-sectalign,__DATA,__llvm_prf_cnts,0x4000
          -C link-arg=-Wl,-sectalign,__DATA,__llvm_prf_bits,0x4000
          -C link-arg=-Wl,-sectalign,__DATA,__llvm_prf_data,0x4000";; esac;
          drop_profiles() { local directory="${CARGO_LLVM_COV_TARGET_DIR:-target/llvm-cov-target}";
          if [[ -d "$directory" ]]; then find "$directory" -name "*.profraw" -delete; fi; };
          trap drop_profiles EXIT;
          env CARGO_LLVM_COV_TARGET_DIR="${CARGO_LLVM_COV_TARGET_DIR:-target/llvm-cov-target}"
          CARGO_UNSTABLE_BUILD_DIR_NEW_LAYOUT=false
          CARGO_UNSTABLE_FINE_GRAIN_LOCKING=false
          RUSTFLAGS="$coverage_rustflags"
          cargo llvm-cov nextest --timings --workspace
          --lib --bins --examples --tests
          --locked --profile ci --lcov
          --no-default-ignore-filename-regex --ignore-filename-regex
          "(/rustc/|/(tests|benches)/|/(tests\.rs|[0-9a-zA-Z_-]+[_-]tests?\.rs)$|/target/llvm-cov-target/|/\.cargo/(registry|git)/|/\.rustup/toolchains/)"
          --output-path coverage.lcov;
          test -s coverage.lcov;
          cargo run -q --locked -p ag-xtask -- check-coverage coverage.lcov'
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: coverage-focused
        name: focused coverage
        description: Generate coverage for AGENTTY_TEST_PACKAGES with an optional AGENTTY_TEST_FILTER and list the uncovered lines and functions under optional AGENTTY_COVERAGE_PATHS.
        entry: >-
          bash -eu -o pipefail -c 'report=target/coverage-focused.lcov; rm -f "$report";
          set -f; packages=(${AGENTTY_TEST_PACKAGES:-}); coverage_paths=(${AGENTTY_COVERAGE_PATHS:-}); set +f;
          if [[ ${#packages[@]} -eq 0 ]]; then
          echo "Set AGENTTY_TEST_PACKAGES to whitespace-separated package names" >&2; exit 1; fi;
          package_args=(); for package in "${packages[@]}"; do package_args+=(-p "$package"); done;
          filter_args=(); if [[ -n "${AGENTTY_TEST_FILTER:-}" ]]; then filter_args=(-E "$AGENTTY_TEST_FILTER"); fi;
          check_args=("$report");
          for coverage_path in ${coverage_paths[@]+"${coverage_paths[@]}"}; do check_args+=(--path "$coverage_path"); done;
          coverage_rustflags="${RUSTFLAGS:-} -C llvm-args=-runtime-counter-relocation";
          case "$(uname -s)" in Darwin)
          coverage_rustflags="$coverage_rustflags
          -C link-arg=-Wl,-sectalign,__DATA,__llvm_prf_cnts,0x4000
          -C link-arg=-Wl,-sectalign,__DATA,__llvm_prf_bits,0x4000
          -C link-arg=-Wl,-sectalign,__DATA,__llvm_prf_data,0x4000";; esac;
          drop_profiles() { local directory="${CARGO_LLVM_COV_TARGET_DIR:-target/llvm-cov-target}";
          if [[ -d "$directory" ]]; then find "$directory" -name "*.profraw" -delete; fi; };
          trap drop_profiles EXIT;
          env CARGO_LLVM_COV_TARGET_DIR="${CARGO_LLVM_COV_TARGET_DIR:-target/llvm-cov-target}"
          CARGO_UNSTABLE_BUILD_DIR_NEW_LAYOUT=false
          CARGO_UNSTABLE_FINE_GRAIN_LOCKING=false
          RUSTFLAGS="$coverage_rustflags"
          cargo llvm-cov nextest --timings "${package_args[@]}"
          --bins --examples --tests
          --locked --profile local --no-tests=fail --lcov
          --no-default-ignore-filename-regex --ignore-filename-regex
          "(/rustc/|/(tests|benches)/|/(tests\.rs|[0-9a-zA-Z_-]+[_-]tests?\.rs)$|/target/llvm-cov-target/|/\.cargo/(registry|git)/|/\.rustup/toolchains/)"
          --output-path "$report" ${filter_args[@]+"${filter_args[@]}"};
          test -s "$report";
          cargo run -q --locked -p ag-xtask -- check-coverage "${check_args[@]}"'
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: coverage-ag-harness-sandbox
        name: native sandbox coverage
        description: Cover ag-harness source and public contracts with native launcher profiling, and run Agentty's command grants under the real sandbox, on qualified Linux and macOS hosts.
        entry: >-
          bash -eu -o pipefail -c 'coverage_rustflags="${RUSTFLAGS:-} -C llvm-args=-runtime-counter-relocation";
          case "$(uname -s)" in Darwin)
          coverage_rustflags="$coverage_rustflags
          -C link-arg=-Wl,-sectalign,__DATA,__llvm_prf_cnts,0x4000
          -C link-arg=-Wl,-sectalign,__DATA,__llvm_prf_bits,0x4000
          -C link-arg=-Wl,-sectalign,__DATA,__llvm_prf_data,0x4000";; esac;
          drop_profiles() { local directory="${CARGO_LLVM_COV_TARGET_DIR:-target/llvm-cov-target}";
          if [[ -d "$directory" ]]; then find "$directory" -name "*.profraw" -delete; fi; };
          trap drop_profiles EXIT;
          env CARGO_LLVM_COV_TARGET_DIR="${CARGO_LLVM_COV_TARGET_DIR:-target/llvm-cov-target}"
          CARGO_UNSTABLE_BUILD_DIR_NEW_LAYOUT=false
          CARGO_UNSTABLE_FINE_GRAIN_LOCKING=false
          RUSTFLAGS="$coverage_rustflags"
          cargo llvm-cov nextest --locked --timings --profile ci -p ag-harness --test sandbox
          --lib --test public_api --test lifecycle --test telemetry --test benchmark_summary
          -p ag-agent --test native_sandbox
          --lcov --output-path target/harness-sandbox.lcov'
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: clippy-ag-harness-features
        name: ag-harness feature lint
        description: Lint ag-harness without default features and with each optional feature that gates code alone. Selected feature unification keeps other workspace members from enabling the omitted features.
        entry: >-
          bash -eu -o pipefail -c 'export CARGO_RESOLVER_FEATURE_UNIFICATION=selected;
          cargo clippy -q --locked -p ag-harness --all-targets --no-default-features -- -D warnings;
          for feature in native-sandbox otel providers-anthropic providers-compat providers-openai sqlite; do
          cargo clippy -q --locked -p ag-harness --all-targets --no-default-features --features "$feature" -- -D warnings; done'
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: coverage-ag-harness-features
        name: ag-harness reduced-feature coverage
        description: Cover ag-harness without default features, with each provider family alone, and with every provider family but no other backend, then require one merged report to cover every line and function those builds compile. The last run, which has the most tests, leaves the JUnit report.
        entry: >-
          bash -eu -o pipefail -c 'report=target/coverage-ag-harness-features.lcov; rm -f "$report";
          export CARGO_RESOLVER_FEATURE_UNIFICATION=selected;
          coverage_rustflags="${RUSTFLAGS:-} -C llvm-args=-runtime-counter-relocation";
          case "$(uname -s)" in Darwin)
          coverage_rustflags="$coverage_rustflags
          -C link-arg=-Wl,-sectalign,__DATA,__llvm_prf_cnts,0x4000
          -C link-arg=-Wl,-sectalign,__DATA,__llvm_prf_bits,0x4000
          -C link-arg=-Wl,-sectalign,__DATA,__llvm_prf_data,0x4000";; esac;
          drop_profiles() { local directory="${CARGO_LLVM_COV_TARGET_DIR:-target/llvm-cov-target}";
          if [[ -d "$directory" ]]; then find "$directory" -name "*.profraw" -delete; fi; };
          trap drop_profiles EXIT;
          coverage() { env CARGO_LLVM_COV_TARGET_DIR="${CARGO_LLVM_COV_TARGET_DIR:-target/llvm-cov-target}"
          CARGO_UNSTABLE_BUILD_DIR_NEW_LAYOUT=false
          CARGO_UNSTABLE_FINE_GRAIN_LOCKING=false
          RUSTFLAGS="$coverage_rustflags" cargo llvm-cov "$@"; };
          coverage clean --workspace;
          for features in "" providers-anthropic providers-openai providers-compat providers-anthropic,providers-compat,providers-openai; do
          coverage nextest --no-report --timings -p ag-harness --no-default-features
          ${features:+--features "$features"} --lib --tests --locked --profile ci; done;
          coverage report --lcov
          --no-default-ignore-filename-regex --ignore-filename-regex
          "(/rustc/|/(tests|benches)/|/(tests\.rs|[0-9a-zA-Z_-]+[_-]tests?\.rs)$|/target/llvm-cov-target/|/\.cargo/(registry|git)/|/\.rustup/toolchains/)"
          --output-path "$report";
          test -s "$report";
          env -u CARGO_RESOLVER_FEATURE_UNIFICATION cargo run -q --locked -p ag-xtask -- check-coverage "$report" --path crates/ag-harness/'
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: check-slow-tests
        name: slow-test ratchet
        description: Report the slowest tests in the CI nextest JUnit report and fail on any test over 5 s that `.config/slow-tests.yaml` does not list.
        entry: cargo run -q --locked -p ag-xtask -- slow-tests target/nextest/ci/junit.xml --max-seconds 5 --allowlist .config/slow-tests.yaml
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
        verbose: true
      - id: cargo-machete
        name: cargo machete
        description: Check workspace manifests for unused dependencies.
        entry: cargo-machete
        language: system
        types: [rust]
        pass_filenames: false
        stages: [manual]
      - id: cargo-audit
        name: cargo audit
        description: Audit `Cargo.lock` against the RustSec advisory database.
        entry: cargo audit
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: test-doc
        name: cargo test doc
        description: Compile and run rustdoc examples across the workspace, including the crate README examples that `ag-harness`, `ag-router`, and `testty` compile as doctests.
        entry: cargo test --locked --doc --workspace
        language: system
        files: (^|/)(.*\.rs|README\.md|Cargo\.(toml|lock)|rust-toolchain\.toml)$
        pass_filenames: false
        stages: [manual]
      - id: package-crates
        name: package published crates
        description: Package and verify-build every publishable workspace crate from its `.crate` tarball, as `cargo publish` would, without uploading. Run it after a version bump; at a version crates.io already holds, Cargo verifies against the published sibling crates.
        entry: cargo publish --dry-run --locked --allow-dirty --workspace
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: cargo-semver-checks
        name: cargo semver-checks
        description: Check each published library crate's public API against its newest crates.io release for changes the workspace version allows, or the optional AGENTTY_SEMVER_RELEASE_TYPE, skipping new crates without a release and the `agentty` application, which no crate depends on.
        entry: >-
          bash -eu -o pipefail -c 'cargo run -q --locked -p ag-xtask -- semver-checks --exclude agentty
          ${AGENTTY_SEMVER_RELEASE_TYPE:+--release-type "$AGENTTY_SEMVER_RELEASE_TYPE"}'
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: public-api
        name: public API snapshots
        description: Compare the `ag-router` and `ag-harness` public APIs, with all features and without blanket or auto-trait impls, against their committed `cargo public-api` snapshots, and require every `ag_router` type in the `ag-harness` API to be re-exported by it. A tool or build failure exits 2 without touching the snapshots. After reviewing an intended change, set AGENTTY_PUBLIC_API_UPDATE=1 to rewrite the snapshots.
        entry: >-
          bash -eu -o pipefail -c 'status=0;
          api=$(mktemp -d); trap "rm -rf \"$api\"" EXIT;
          for crate in ag-router ag-harness; do
          if ! cargo public-api --color never -ss --all-features -p "$crate" > "$api/$crate.txt"; then
          echo "cargo public-api failed for $crate; check the tool version pinned in .github/actions/setup-rust-prek/action.yml and the build output above" >&2;
          exit 2;
          fi;
          done;
          for name in $(grep -Eo "ag_router::([a-z_]+::)*[A-Z][A-Za-z0-9]*" "$api/ag-harness.txt" | sed "s/.*:://" | sort -u); do
          grep -Eq "^pub use ag_harness::([a-z_]+::)*$name\$" "$api/ag-harness.txt"
          || { echo "ag-harness exposes ag_router type $name without re-exporting it" >&2; status=1; };
          done;
          for crate in ag-router ag-harness; do
          snapshot="crates/$crate/public-api.txt";
          if [ "${AGENTTY_PUBLIC_API_UPDATE:-}" = 1 ]; then
          cp "$api/$crate.txt" "$snapshot";
          else
          diff -u "$snapshot" "$api/$crate.txt" || status=1;
          fi;
          done;
          if [ "$status" != 0 ]; then
          echo "Review the API change, then rerun with AGENTTY_PUBLIC_API_UPDATE=1 to update the snapshots." >&2;
          fi;
          exit "$status"'
        language: system
        files: ^(Cargo\.(toml|lock)|rust-toolchain\.toml|crates/(ag-harness|ag-router)/(Cargo\.toml|public-api\.txt|src/.*\.rs))$
        pass_filenames: false
        stages: [manual]
      - id: zola-check
        name: zola check
        description: Verify the Zola docs site builds without broken links.
        entry: zola --root docs/site check
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
      - id: check-execution-boundary
        name: execution boundary
        description: Verify model execution flows only through worker-owned crates and agent CLIs launch only from `ag-agent`.
        entry: cargo run -q --locked -p ag-xtask -- check-execution-boundary
        language: system
        files: (^|/)(Cargo\.toml|Cargo\.lock|.*\.rs)$
        pass_filenames: false
      - id: check-manifests
        name: check manifests
        description: Verify member manifests inherit every dependency from `[workspace.dependencies]`, never enable Tokio's `full` feature, and avoid dependencies banned for their crate.
        entry: cargo run -q --locked -p ag-xtask -- check-manifests
        language: system
        files: (^|/)Cargo\.toml$
        pass_filenames: false
      - id: check-release-workflow
        name: check release workflow
        description: Verify `.github/workflows/release.yml` is what `ag-release workflow` generates from `[workspace.metadata.release]`; run `cargo run -p ag-release -- workflow` to regenerate it.
        entry: cargo run -q --locked -p ag-release -- workflow --check
        language: system
        files: ^(Cargo\.toml|\.github/workflows/release\.yml|crates/ag-release/.*)$
        pass_filenames: false
      - id: check-module-routers
        name: check module routers
        description: Verify each `module.rs` paired with a `module/` directory only declares child modules and re-exports.
        entry: cargo run -q --locked -p ag-xtask -- check-module-routers
        language: system
        files: \.rs$
        pass_filenames: false
      - id: ast-grep
        name: ast-grep rules
        description: Enforce the repository structure rules in `lint/rules/` across Rust sources.
        entry: ast-grep scan
        language: python
        additional_dependencies: [ast-grep-cli==0.51.1]
        files: (\.rs|^lint/.*\.yml|^sgconfig\.yml)$
        pass_filenames: false
      - id: ast-grep-test
        name: ast-grep rule tests
        description: Check each rule in `lint/rules/` against its valid and invalid cases in `lint/rule-tests/`.
        entry: ast-grep test --skip-snapshot-tests
        language: python
        additional_dependencies: [ast-grep-cli==0.51.1]
        files: ^(lint/.*\.yml|sgconfig\.yml)$
        pass_filenames: false
      - id: check-migrations
        name: check migrations
        description: Verify SQL migration files are named `NNN_description.sql` with unique prefix numbers and that migrations existing at the fork point from `origin/main` (or `AGENTTY_MIGRATION_BASE`) are unchanged.
        entry: cargo run -q --locked -p ag-xtask -- check-migrations
        language: system
        types: [sql]
        pass_filenames: false
      - id: validate-prek-config
        name: validate prek config
        description: Validate the `prek` hook catalog whenever `.pre-commit-config.yaml` changes.
        entry: prek validate-config .pre-commit-config.yaml
        language: system
        files: ^\.pre-commit-config\.yaml$
        pass_filenames: false
      - id: check-instructions
        name: instruction integrity
        description: Check instruction links, literal repository paths, aliases, and documented hook names, including untracked instructions.
        entry: cargo run -q --locked -p ag-xtask -- check-instructions
        language: system
        always_run: true
        pass_filenames: false
      - id: check-standards
        name: standards manifest
        description: Check that `standards.toml` names existing exports, that exported instruction sections, skills, shared ast-grep rules, and design files name no workspace crate, hook, or unexported repository path, and that design exports load nothing beyond the exported files beside them. It runs on every change because any new path or crate can make an export unportable.
        entry: cargo run -q --locked -p ag-xtask -- check-standards
        language: system
        always_run: true
        pass_filenames: false
      - id: check-design-tokens
        name: design tokens
        description: Check that the stylesheets, brand asset copies, and `theme-color` values generated from `design/` are current, that hand-written stylesheets and the web surfaces' scripts and templates name no raw colour, and that the colour pairs the token file lists keep their contrast in both themes; `cargo run -p ag-xtask -- design-tokens` regenerates them. It runs on every change because any new stylesheet, script, or template must use tokens too.
        entry: cargo run -q --locked -p ag-xtask -- design-tokens --check
        language: system
        always_run: true
        pass_filenames: false
