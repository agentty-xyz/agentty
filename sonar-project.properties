sonar.projectKey=agentty-xyz_agentty
sonar.organization=agentty-xyz
sonar.rust.lcov.reportPaths=coverage.lcov
sonar.javascript.lcov.reportPaths=timing-action.lcov

# Keep analysis on production code. Rust patterns match the coverage hook's filters;
# JavaScript tests use the Node test-runner filename convention.
sonar.exclusions=**/*_test.rs,**/tests.rs,**/tests/**,**/benches/**,**/*.test.mjs

sonar.issue.ignore.multicriteria=sqliteMigrationStrings,sqliteMigrationNulls,legacySessionInstructionReset
sonar.issue.ignore.multicriteria.sqliteMigrationStrings.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.sqliteMigrationStrings.resourceKey=**/*.sql
sonar.issue.ignore.multicriteria.sqliteMigrationNulls.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.sqliteMigrationNulls.resourceKey=**/*.sql

# Migration 100 discarded applied-profile tracking; every existing session needs the reset marker.
sonar.issue.ignore.multicriteria.legacySessionInstructionReset.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.legacySessionInstructionReset.resourceKey=crates/ag-store/migrations/101_clear_legacy_session_agent_instructions.sql

# SQL migrations, Rust tests, palette data, and provider adapter boundaries are intentionally repetitive.
sonar.cpd.exclusions=**/*.sql,**/*_test.rs,**/tests/**/*.rs,crates/agentty/src/ui/style.rs,crates/ag-forge/src/client.rs,crates/ag-forge/src/github.rs,crates/ag-forge/src/gitlab.rs

# The docs site ships browser scripts without a JavaScript coverage report.
sonar.coverage.exclusions=docs/site/**

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=agentty
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
