sonar.projectKey=agentty-xyz_agentty
sonar.organization=agentty-xyz
sonar.rust.lcov.reportPaths=coverage.lcov

sonar.issue.ignore.multicriteria=sqliteMigrationStrings,sqliteMigrationNulls
sonar.issue.ignore.multicriteria.sqliteMigrationStrings.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.sqliteMigrationStrings.resourceKey=**/*.sql
sonar.issue.ignore.multicriteria.sqliteMigrationNulls.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.sqliteMigrationNulls.resourceKey=**/*.sql

# SQL migrations, Rust tests, palette data, and provider adapter boundaries are intentionally repetitive.
sonar.cpd.exclusions=**/*.sql,**/*_test.rs,**/tests/**/*.rs,crates/agentty/src/ui/style.rs,crates/ag-forge/src/client.rs,crates/ag-forge/src/github.rs,crates/ag-forge/src/gitlab.rs


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=agentty
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
