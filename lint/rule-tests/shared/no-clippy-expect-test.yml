id: no-clippy-expect
valid:
  - "#[expect(unsafe_code, reason = \"the kernel API has no wrapper\")]\nfn confine() {}"
  - "#[cfg_attr(test, mockall::automock)]\ntrait Clock {}"
invalid:
  - "#[expect(clippy::too_many_lines)]\nfn render() {}"
  - "#[expect(dead_code, clippy::unused_self)]\nfn render() {}"
  - "#[cfg_attr(test, expect(clippy::panic))]\nfn render() {}"
  - "#[cfg_attr(all(test, unix), expect(clippy::panic))]\nfn render() {}"
  - "#[cfg_attr(\n    test,\n    expect(clippy::panic)\n)]\nfn render() {}"
  - "#[cfg_attr(\n    all(test, unix),\n    expect(clippy::panic)\n)]\nfn render() {}"
  - '#![expect(clippy::pedantic)]'
