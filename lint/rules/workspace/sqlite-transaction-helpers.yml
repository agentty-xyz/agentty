id: sqlite-transaction-helpers
language: rust
severity: error
message: Begin SQLite transactions with `ag_sqlite::begin_write` or `ag_sqlite::begin_read`, not the pool's `begin` methods.
note: |
  Use `begin_write` for a transaction that may write and `begin_read` for a read-only
  snapshot; `crates/ag-sqlite/src/lib.rs` documents why the write lock is taken up front.
  In `ag-store`, call the labeling wrappers in `crates/ag-store/src/connection.rs`. The
  rule covers only the crates that own SQLite pools, because other crates have unrelated
  `begin` methods.
files:
  - crates/ag-harness/src/**/*.rs
  - crates/ag-store/src/**/*.rs
ignores:
  - "**/*_test.rs"
  - "**/*_test/**"
rule:
  kind: call_expression
  has:
    field: function
    kind: field_expression
    has:
      field: field
      regex: "^(try_)?begin(_with)?$"
